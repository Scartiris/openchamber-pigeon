<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Chinese documents name fonts nobody ships: 宋体 / SimSun, 黑体 / SimHei,
  仿宋_GB2312, 方正小标宋简体. Without a rule, fontconfig falls back to whichever
  Noto CJK face it finds first - and that is the Japanese one, whose glyph
  variants differ from Simplified Chinese for a number of characters, and which
  loses the serif/sans distinction the document was written with.

  Mapping the usual names onto the Simplified Chinese faces keeps 宋体/仿宋
  documents serif and 黑体/雅黑 documents sans, which is what the author saw.
  Faces that do not exist at all (楷体, 方正小标宋) land on the closest family
  available rather than on a fallback nobody chose.
-->
<fontconfig>
  <!-- Serif faces: 宋体 family and the 仿宋/楷体 names that have no kai face here -->
  <match target="pattern">
    <test name="family" compare="eq"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>NSimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>新宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>FangSong</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>仿宋</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>KaiTi</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>楷体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>楷体_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>方正小标宋简体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>微软雅黑</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- Sans faces: 黑体 family -->
  <match target="pattern">
    <test name="family" compare="eq"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>黑体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- A bare Noto CJK request (no language) should land on Simplified Chinese
       too, which is also what LibreOffice's own fallback ends up asking for. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans CJK JP</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Serif CJK JP</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
</fontconfig>
